services:
  api:
    image: python:3.11-slim
    working_dir: /app/server
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  web:
    image: node:22-alpine
    working_dir: /app/web
    volumes:
      - ./:/app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
